name: Laravel CI/CD

on:
  push:
    branches: [ "main", "dev", "staging" ]
  pull_request:
    branches: [ "main", "dev", "staging" ]

jobs:
  laravel-tests:
    name: Run Unit & Feature Tests
    runs-on: ubuntu-latest

    steps:
    - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
      with:
        php-version: '8.2'
    - uses: actions/checkout@v4
    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"
    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
    - name: Generate key
      run: php artisan key:generate
    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache
    - name: Create Database
      run: |
        mkdir -p database
        touch database/database.sqlite
    - name: Execute tests (Unit and Feature tests) via PHPUnit/Pest
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: php artisan test

  deploy-dev:
    name: Deploy to Dev Environment (Port 5000)
    environment: vps1
    needs: laravel-tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    steps:
    - name: Connect SSH & Deploy Docker Container (Dev)
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_IP }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: 22
        command_timeout: 30m
        script: |
          REMOTE_DIR="/root/efkdm-dev"
          APP_NAME="efkdm-dev"
          APP_PORT="5000"

          echo "--> Checking directory $REMOTE_DIR..."
          if [ ! -d "$REMOTE_DIR" ]; then
            echo "--> Cloning repository to $REMOTE_DIR..."
            git clone https://github.com/${{ github.repository }}.git $REMOTE_DIR
          fi

          cd $REMOTE_DIR
          git config --global --add safe.directory $REMOTE_DIR
          echo "--> Fetching latest code..."
          git fetch origin
          git checkout ${{ github.ref_name }}
          git pull origin ${{ github.ref_name }}

          echo "--> Checking Docker installation on VPS..."
          command -v docker || (apt-get update && apt-get install -y docker.io docker-compose)

          echo "--> Rebuilding Docker container $APP_NAME..."
          docker stop $APP_NAME 2>/dev/null || true
          docker rm $APP_NAME 2>/dev/null || true
          docker build -t ${APP_NAME}:latest .
          docker run -d --name $APP_NAME -p ${APP_PORT}:80 -v ${REMOTE_DIR}:/var/www/html --restart always ${APP_NAME}:latest

          echo "--> Setting up environment & Laravel inside container..."
          [ -f .env ] || cp .env.example .env
          sed -i 's|/usr/share/nginx/html/database/database.sqlite|/var/www/html/database/database.sqlite|g' .env 2>/dev/null || true
          mkdir -p database && touch database/database.sqlite

          docker exec $APP_NAME composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
          docker exec $APP_NAME php artisan key:generate --force
          docker exec $APP_NAME php artisan migrate --force
          docker exec $APP_NAME php artisan db:seed --force 2>/dev/null || true
          docker exec $APP_NAME rm -rf /var/www/html/public/storage 2>/dev/null || true
          docker exec $APP_NAME php artisan storage:link --force 2>/dev/null || true
          docker exec $APP_NAME php artisan config:clear
          docker exec $APP_NAME php artisan cache:clear

          echo "--> Dev Deployment Completed Successfully!"
          echo "--> Docker Container '$APP_NAME' is live at http://202.10.36.205:${APP_PORT}"

  deploy-staging:
    name: Deploy to Staging Environment (Port 5001)
    environment: vps1
    needs: laravel-tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'

